services:
  worker:
    build: .
    init: true
    # Fail closed until the target and source contract have been validated.
    command: ["node", "dist/main.js", "${WORKER_COMMAND:-check}"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      OLOS_SOURCE_KEY: ${OLOS_SOURCE_KEY:?set OLOS_SOURCE_KEY}
      OLOS_BASE_URL: ${OLOS_BASE_URL:-}
      OLOS_USERNAME: ${OLOS_USERNAME:-}
      OLOS_PASSWORD: ${OLOS_PASSWORD:-}
      OLOS_CLIENT_ID: ${OLOS_CLIENT_ID:-}
      OLOS_CLIENT_SECRET: ${OLOS_CLIENT_SECRET:-}
      OLOS_TLS_VERIFY: ${OLOS_TLS_VERIFY:-true}
      DESTINATION_SCHEMA: ${DESTINATION_SCHEMA:-raw}
      DESTINATION_TABLE: ${DESTINATION_TABLE:-olos_calls}
      SOURCE_ID_UNIQUENESS_CONFIRMED: ${SOURCE_ID_UNIQUENESS_CONFIRMED:-false}
      SOURCE_TIME_ZONE: ${SOURCE_TIME_ZONE:-}
      INGESTION_BASELINE: ${INGESTION_BASELINE:?set INGESTION_BASELINE}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-120000}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-10000}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      STATIC_CACHE_TTL_MS: ${STATIC_CACHE_TTL_MS:-3600000}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-134217728}
      NODE_OPTIONS: --max-old-space-size=1536
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-5}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - default
      - postgres-local

networks:
  postgres-local:
    external: true
    name: olos-exportdata-local_local-only
