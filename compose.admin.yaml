# Optional replacement command for the SAME worker service. Never run beside the CLI consumer.
services:
  worker:
    ports:
      - "127.0.0.1:8082:8080"
    command: ["node", "dist/main.js", "admin"]
    environment:
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?set ADMIN_ORIGIN}
      ADMIN_BIND: 0.0.0.0
      ADMIN_PORT: 8080
      ADMIN_ENCRYPTION_KEY: ${ADMIN_ENCRYPTION_KEY:?set ADMIN_ENCRYPTION_KEY}
      ADMIN_OLOS_USERS_JSON: ${ADMIN_OLOS_USERS_JSON:?set ADMIN_OLOS_USERS_JSON}
      ADMIN_OLOS_ALLOWED_ORIGINS: ${ADMIN_OLOS_ALLOWED_ORIGINS:-}
      ADMIN_REPORT_CONTRACT_VERSION: ${ADMIN_REPORT_CONTRACT_VERSION:-2}
      ADMIN_REPORT_CORPORATE_DATABASE_URL: ${ADMIN_REPORT_CORPORATE_DATABASE_URL:-}
      ADMIN_REPORT_CORPORATE_CA_FILE: ${ADMIN_REPORT_CORPORATE_CA_FILE:-}
      ADMIN_REPORT_TIMESTAMP_ZONE: ${ADMIN_REPORT_TIMESTAMP_ZONE:-}
      ADMIN_REPORT_TIMESTAMP_CONFIRMATION: ${ADMIN_REPORT_TIMESTAMP_CONFIRMATION:-}
    # Dokploy routes HTTPS to this internal port on the same service's proxy network.
    # No administrative HTTP port is published on the host.
    expose: ["8080"]
    # Allows an existing finite HTTP request/DB batch to finish. Verify with production volumes.
    stop_grace_period: 10m
